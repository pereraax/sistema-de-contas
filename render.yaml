# Deploy no Render: configure as variáveis sensíveis no Dashboard (Environment)
# para não expor no repositório. Aqui só as que definem o domínio e ambiente.
services:
  - type: web
    name: sistema-de-contas-1
    env: node
    buildCommand: npm install && npm run build
    startCommand: ./start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      # Links de confirmação de email usarão este domínio (obrigatório para emails com plenipay.com)
      - key: NEXT_PUBLIC_SITE_URL
        value: https://plenipay.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://plenipay.com
